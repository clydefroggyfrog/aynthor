name: Build Thor A740 v7.1 Stable Performance

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Whitebelyash Mesa branch, tag, or commit"
        required: true
        default: "turnip/gen8"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip ninja-build pkg-config \
            flex bison clang lld llvm ccache \
            python3 python3-pip patchelf glslang-tools patch file
          python3 -m pip install --break-system-packages -U \
            meson mako pyyaml packaging

      - name: Download Android NDK r29
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o /tmp/android-ndk.zip

          unzip -q /tmp/android-ndk.zip -d "$HOME"

          NDK_ROOT="$HOME/android-ndk-r29"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"

          test -x "$NDK_BIN/aarch64-linux-android33-clang"
          test -x "$NDK_BIN/aarch64-linux-android33-clang++"

      - name: Download Whitebelyash Mesa
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
        run: |
          set -euxo pipefail
          rm -rf mesa

          git clone \
            --filter=blob:none \
            --no-single-branch \
            https://github.com/whitebelyash/mesa-unified.git \
            mesa

          git -C mesa fetch --depth=1 origin "$MESA_REF"
          git -C mesa checkout --detach FETCH_HEAD

          echo "Mesa commit:"
          git -C mesa rev-parse HEAD
          echo "Mesa version:"
          cat mesa/VERSION

      - name: Apply Android compatibility fixes
        working-directory: mesa
        run: |
          set -euxo pipefail

          sed -i \
            's/typedef const native_handle_t\* buffer_handle_t;/typedef void* buffer_handle_t;/g' \
            include/android_stub/cutils/native_handle.h || true

          sed -i \
            's/, hnd->handle/, (void *)hnd->handle/g' \
            src/util/u_gralloc/u_gralloc_fallback.c || true

          sed -i -E \
            's/([a-z_]+)->handle->/((const native_handle_t *)\1->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            's/anb->handle->/((const native_handle_t *)anb->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            "/-Werror=gnu-empty-initializer/d" \
            meson.build || true

      - name: Apply Thor A740 performance tuning
        working-directory: mesa
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/freedreno/vulkan/tu_autotune.cc")

          if not p.exists():
              raise SystemExit("tu_autotune.cc was not found")

          s = p.read_text()

          changed = False

          # Prefer the more accurate profiled GMEM/SYSMEM selection.
          if "DEFAULT = BANDWIDTH" in s:
              s = s.replace(
                  "DEFAULT = BANDWIDTH",
                  "DEFAULT = PROFILED",
                  1
              )
              changed = True
          elif "DEFAULT = PROFILED" in s:
              print("PROFILED autotune is already the default")
          else:
              print("Autotune enum layout changed; leaving it untouched")

          # Reduce warm-up only when this exact constant exists.
          if "MIN_PROFILE_DURATION_COUNT = 5" in s:
              s = s.replace(
                  "MIN_PROFILE_DURATION_COUNT = 5",
                  "MIN_PROFILE_DURATION_COUNT = 3",
                  1
              )
              changed = True

          p.write_text(s)

          print("Thor performance patch status:")
          print(" changed =", changed)
          PY

          grep -n \
            -E 'DEFAULT = (PROFILED|BANDWIDTH)|MIN_PROFILE_DURATION_COUNT' \
            src/freedreno/vulkan/tu_autotune.cc | head -20 || true

      - name: Create Android cross and native files
        working-directory: mesa
        run: |
          set -euxo pipefail

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$NDK_BIN/llvm-ar'
          c = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang']
          cpp = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$NDK_BIN/ld.lld'
          cpp_ld = '$NDK_BIN/ld.lld'
          strip = '$NDK_BIN/llvm-strip'
          ranlib = '$NDK_BIN/llvm-ranlib'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat > native.txt <<EOF
          [binaries]
          c = ['ccache', 'clang']
          cpp = ['ccache', 'clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          echo "Android cross file:"
          cat android-aarch64.txt
          echo "Native file:"
          cat native.txt

      - name: Configure Turnip v7.1
        working-directory: mesa
        env:
          CC: clang
          CXX: clang++
          AR: llvm-ar
          RANLIB: llvm-ranlib
          STRIP: llvm-strip
          OBJDUMP: llvm-objdump
          OBJCOPY: llvm-objcopy
          LDFLAGS: -fuse-ld=lld
        run: |
          set -euxo pipefail

          rm -rf build-android-aarch64
          rm -rf /tmp/turnip-thor-v71

          meson setup build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --native-file native.txt \
            --prefix /tmp/turnip-thor-v71 \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_lto=false \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=

      - name: Compile Turnip
        working-directory: mesa
        run: |
          set -o pipefail

          # Verbose output makes any remaining compiler/linker failure visible
          # directly in the GitHub Actions log.
          ninja -v -C build-android-aarch64 install 2>&1 | tee /tmp/thor-v71-build.log

      - name: Inspect compiled driver
        run: |
          set -euxo pipefail

          DRIVER="$(find /tmp/turnip-thor-v71 mesa/build-android-aarch64 \
            -type f -name 'libvulkan_freedreno.so' -print -quit)"

          if [ -z "$DRIVER" ] || [ ! -f "$DRIVER" ]; then
            echo "ERROR: libvulkan_freedreno.so was not produced."
            echo "Last 120 build-log lines:"
            tail -120 /tmp/thor-v71-build.log || true
            exit 1
          fi

          echo "Driver:"
          file "$DRIVER"

          echo "Dependencies:"
          patchelf --print-needed "$DRIVER" || true

      - name: Package Eden driver
        run: |
          set -euxo pipefail

          DRIVER="$(find /tmp/turnip-thor-v71 mesa/build-android-aarch64 \
            -type f -name 'libvulkan_freedreno.so' -print -quit)"

          MESA_VERSION="$(tr -d '\r\n' < mesa/VERSION)"
          MESA_SHA="$(git -C mesa rev-parse --short=12 HEAD)"

          rm -rf package out
          mkdir -p package out

          cp "$DRIVER" package/libvulkan_freedreno.so

          "$NDK_BIN/llvm-strip" \
            --strip-unneeded \
            package/libvulkan_freedreno.so || true

          cat > package/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Thor A740 v7.1 Stable Performance",
            "description": "AYN Thor Snapdragon 8 Gen 2 / Adreno 740 Turnip build for Eden. Whitebelyash turnip/gen8 base with Thor profiled autotuning and conservative known-good build flags.",
            "author": "Thor A740 Project",
            "packageVersion": "7.1",
            "vendor": "Mesa",
            "driverVersion": "${MESA_VERSION}-${MESA_SHA}",
            "minApi": 33,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          ZIP="out/ThorA740-v7.1-StablePerformance-${MESA_VERSION}-${MESA_SHA}.zip"

          (
            cd package
            zip -9 "../$ZIP" \
              libvulkan_freedreno.so \
              meta.json
          )

          echo "Created:"
          ls -lh "$ZIP"

          echo "Contents:"
          unzip -l "$ZIP"

      - name: Validate Eden package
        run: |
          set -euxo pipefail

          ZIP="$(find out -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          test -f "$ZIP"

          python3 - "$ZIP" <<'PY'
          import json
          import sys
          import zipfile

          path = sys.argv[1]

          with zipfile.ZipFile(path) as z:
              files = {
                  x for x in z.namelist()
                  if not x.endswith("/")
              }

              expected = {
                  "meta.json",
                  "libvulkan_freedreno.so"
              }

              if files != expected:
                  raise SystemExit(
                      f"Wrong ZIP contents: {sorted(files)}"
                  )

              meta = json.loads(z.read("meta.json"))

              if meta.get("libraryName") != "libvulkan_freedreno.so":
                  raise SystemExit("libraryName is wrong")

              if meta.get("minApi") != 33:
                  raise SystemExit("minApi is wrong")

              if meta.get("packageVersion") != "7.1":
                  raise SystemExit("packageVersion is wrong")

          print("Thor A740 v7.1 Eden package validation PASSED")
          PY

      - name: Upload Thor A740 v7.1 driver
        uses: actions/upload-artifact@v6
        with:
          name: ThorA740-v7.1-Stable-Performance
          path: out/*.zip
          if-no-files-found: error
