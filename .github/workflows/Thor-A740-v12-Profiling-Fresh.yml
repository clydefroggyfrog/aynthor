name: Build Thor A740 v12 Profiling Driver

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa branch, tag, or commit"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip ninja-build pkg-config \
            flex bison clang lld llvm ccache \
            python3 python3-pip patchelf glslang-tools patch file
          python3 -m pip install --break-system-packages -U \
            meson mako pyyaml packaging

      - name: Download Android NDK r29
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d "$HOME"

          NDK_ROOT="$HOME/android-ndk-r29"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"

      - name: Download Mesa
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
        run: |
          set -euxo pipefail
          rm -rf mesa
          git clone --filter=blob:none https://github.com/mirror/mesa.git mesa
          git -C mesa fetch --depth=1 origin "$MESA_REF"
          git -C mesa checkout --detach FETCH_HEAD
          git -C mesa rev-parse HEAD
          cat mesa/VERSION

      - name: Apply Android compatibility fixes
        working-directory: mesa
        run: |
          set -euxo pipefail
          sed -i \
            's/typedef const native_handle_t\* buffer_handle_t;/typedef void* buffer_handle_t;/g' \
            include/android_stub/cutils/native_handle.h || true
          sed -i \
            's/, hnd->handle/, (void *)hnd->handle/g' \
            src/util/u_gralloc/u_gralloc_fallback.c || true
          sed -i -E \
            's/([a-z_]+)->handle->/((const native_handle_t *)\1->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true
          sed -i \
            's/anb->handle->/((const native_handle_t *)anb->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true
          sed -i "/-Werror=gnu-empty-initializer/d" meson.build || true

      - name: Apply v11 Prefer-GMEM baseline
        working-directory: mesa
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("src/freedreno/vulkan/tu_autotune.cc")
          s = p.read_text()

          pattern = (
              r"DEFAULT\s*=\s*"
              r"(?:BANDWIDTH|PROFILED|PROFILED_IMM|PREFER_GMEM|PREFER_SYSMEM)"
          )

          if not re.search(pattern, s):
              raise SystemExit("ERROR: autotune DEFAULT selector not found")

          s, n = re.subn(pattern, "DEFAULT = PREFER_GMEM", s, count=1)
          if n != 1:
              raise SystemExit("ERROR: failed to select PREFER_GMEM")

          p.write_text(s)
          print("Prefer-GMEM enabled")
          PY

      - name: Enable built-in u_trace profiler
        working-directory: mesa
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/util/perf/u_trace.c")
          if not p.exists():
              raise SystemExit("ERROR: src/util/perf/u_trace.c not found")

          s = p.read_text()

          old = 'debug_get_flags_option("MESA_GPU_TRACES", config_control, 0);'
          new = (
              'debug_get_flags_option("MESA_GPU_TRACES", config_control, '
              'U_TRACE_TYPE_PRINT);'
          )

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("ERROR: MESA_GPU_TRACES selector not found")

          old_file = 'DEBUG_GET_ONCE_OPTION(trace_file, "MESA_GPU_TRACEFILE", NULL)'
          new_file = (
              'DEBUG_GET_ONCE_OPTION(trace_file, "MESA_GPU_TRACEFILE", '
              '"/sdcard/Download/thor_v12_trace.txt")'
          )

          if old_file in s:
              s = s.replace(old_file, new_file, 1)
          elif new_file not in s:
              raise SystemExit("ERROR: MESA_GPU_TRACEFILE selector not found")

          p.write_text(s)
          print("u_trace enabled")
          PY

      - name: Create build files
        working-directory: mesa
        run: |
          set -euxo pipefail

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$NDK_BIN/llvm-ar'
          c = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang']
          cpp = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$NDK_BIN/ld.lld'
          cpp_ld = '$NDK_BIN/ld.lld'
          strip = '$NDK_BIN/llvm-strip'
          ranlib = '$NDK_BIN/llvm-ranlib'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat > native.txt <<EOF
          [build_machine]
          c = ['ccache', 'clang']
          cpp = ['ccache', 'clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure profiling build
        working-directory: mesa
        run: |
          set -euxo pipefail

          export CC=clang
          export CXX=clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export STRIP=llvm-strip
          export OBJDUMP=llvm-objdump
          export OBJCOPY=llvm-objcopy
          export LDFLAGS="-fuse-ld=lld -flto=thin"
          export CFLAGS="-D__ANDROID__ -O3 -fno-plt -flto=thin -Wno-error"
          export CXXFLAGS="-D__ANDROID__ -O3 -fno-plt -flto=thin -Wno-error"

          rm -rf build-android-aarch64 /tmp/turnip-thor-v12

          meson setup build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --native-file native.txt \
            --prefix /tmp/turnip-thor-v12 \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dstrip=false \
            -Dperfetto=false \
            -Dplatforms=android \
            -Dvideo-codecs= \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled

      - name: Compile profiling driver
        working-directory: mesa
        run: |
          set -o pipefail
          ninja -v -C build-android-aarch64 install 2>&1 \
            | tee /tmp/thor-v12-build.log

      - name: Package profiling driver
        run: |
          set -euxo pipefail

          DRIVER="$(find /tmp/turnip-thor-v12 mesa/build-android-aarch64 \
            -type f -name 'libvulkan_freedreno.so' -print -quit)"

          test -n "$DRIVER"
          test -f "$DRIVER"

          MESA_VERSION="$(tr -d '\r\n' < mesa/VERSION)"
          MESA_SHA="$(git -C mesa rev-parse --short=12 HEAD)"

          rm -rf package out
          mkdir -p package out

          cp "$DRIVER" package/libvulkan_freedreno.so

          cat > package/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Thor A740 v12 Profiling",
            "description": "AYN Thor Adreno 740 profiling driver for Eden with Prefer-GMEM and built-in Turnip u_trace timing.",
            "author": "Thor A740 Project",
            "packageVersion": "12-profile",
            "vendor": "Mesa",
            "driverVersion": "${MESA_VERSION}-${MESA_SHA}",
            "minApi": 33,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          ZIP="out/ThorA740-v12-Profiling-${MESA_VERSION}-${MESA_SHA}.zip"

          (
            cd package
            zip -9 "../$ZIP" \
              libvulkan_freedreno.so \
              meta.json
          )

          cat > out/PROFILE-INSTRUCTIONS.txt <<'EOF'
          Thor A740 v12 Profiling

          1. Install the inner ThorA740-v12-Profiling-*.zip in Eden.
          2. Select Thor A740 v12 Profiling.
          3. Fully restart Eden.
          4. Run the same Mario Galaxy scene for 15-30 seconds.
          5. Fully close Eden.
          6. Check Android Download for:
             thor_v12_trace.txt
          7. Upload that file back to ChatGPT.

          This driver adds profiling overhead, so do not compare its FPS
          directly to T30 or v11.
          EOF

          unzip -l "$ZIP"
          ls -lh out/*

      - name: Upload profiling kit
        uses: actions/upload-artifact@v6
        with:
          name: ThorA740-v12-Profiling-Kit
          path: |
            out/ThorA740-v12-Profiling-*.zip
            out/PROFILE-INSTRUCTIONS.txt
          if-no-files-found: error
