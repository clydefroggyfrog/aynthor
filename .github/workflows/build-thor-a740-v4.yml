name: Build Thor A740 v4

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa branch, tag, or commit"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            ninja-build \
            pkg-config \
            flex \
            bison \
            clang \
            lld \
            llvm \
            ccache \
            python3 \
            python3-pip \
            patchelf \
            glslang-tools \
            patch \
            file

          python3 -m pip install \
            --break-system-packages \
            -U meson mako pyyaml packaging

      - name: Download Android NDK r29
        run: |
          echo "Downloading Android NDK r29..."

          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o /tmp/android-ndk.zip

          unzip -q /tmp/android-ndk.zip -d "$HOME"

          echo "NDK=$HOME/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

          echo "NDK installed:"
          ls "$HOME/android-ndk-r29"

      - name: Download Mesa
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
        run: |
          echo "Downloading Mesa..."

          git clone \
            --filter=blob:none \
            https://github.com/mirror/mesa.git \
            mesa

          git -C mesa fetch \
            --depth=1 \
            origin "$MESA_REF"

          git -C mesa checkout \
            --detach FETCH_HEAD

          echo
          echo "Mesa commit:"
          git -C mesa rev-parse HEAD

          echo
          echo "Mesa version:"
          cat mesa/VERSION

      - name: Apply Android NDK fixes
        working-directory: mesa
        run: |
          sed -i \
            's/typedef const native_handle_t\* buffer_handle_t;/typedef void* buffer_handle_t;/g' \
            include/android_stub/cutils/native_handle.h || true

          sed -i \
            's/, hnd->handle/, (void *)hnd->handle/g' \
            src/util/u_gralloc/u_gralloc_fallback.c || true

          sed -i -E \
            's/([a-z_]+)->handle->/((const native_handle_t *)\1->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            's/anb->handle->/((const native_handle_t *)anb->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            "/-Werror=gnu-empty-initializer/d" \
            meson.build || true

      - name: Create Android cross file
        working-directory: mesa
        run: |
          if [ -f "$NDK/aarch64-linux-android36-clang" ]; then
            API=36
          elif [ -f "$NDK/aarch64-linux-android35-clang" ]; then
            API=35
          elif [ -f "$NDK/aarch64-linux-android34-clang" ]; then
            API=34
          else
            echo "ERROR: Android ARM64 compiler not found."
            exit 1
          fi

          echo "Using Android API compiler: $API"

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$NDK/llvm-ar'
          c = ['$NDK/aarch64-linux-android${API}-clang']
          cpp = ['$NDK/aarch64-linux-android${API}-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$NDK/ld.lld'
          cpp_ld = '$NDK/ld.lld'
          strip = '$NDK/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          echo
          echo "Cross file:"
          cat android-aarch64.txt

      - name: Configure Turnip
        working-directory: mesa
        run: |
          rm -rf build-android-aarch64
          rm -rf "$GITHUB_WORKSPACE/install"

          meson setup \
            build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --prefix "$GITHUB_WORKSPACE/install" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=36 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=

      - name: Compile Turnip
        working-directory: mesa
        run: |
          echo "Compiling Turnip..."
          ninja -C build-android-aarch64 install

      - name: Find compiled driver
        run: |
          echo "Searching for libvulkan_freedreno.so..."

          DRIVER="$(find install mesa/build-android-aarch64 \
            -type f \
            -name 'libvulkan_freedreno.so' \
            -print \
            -quit)"

          if [ -z "$DRIVER" ]; then
            echo "ERROR: libvulkan_freedreno.so was not generated."
            exit 1
          fi

          echo "Found driver:"
          echo "$DRIVER"

          echo
          echo "Driver information:"
          file "$DRIVER"

          mkdir -p package out

          cp "$DRIVER" \
            package/libvulkan_freedreno.so

          echo
          echo "Shared-library dependencies:"
          patchelf \
            --print-needed \
            package/libvulkan_freedreno.so || true

      - name: Package Eden driver
        run: |
          MESA_VERSION="$(tr -d '\r\n' < mesa/VERSION)"
          MESA_SHA="$(git -C mesa rev-parse --short=12 HEAD)"

          echo "Mesa version: $MESA_VERSION"
          echo "Mesa commit:  $MESA_SHA"

          rm -rf out
          mkdir -p out

          cat > package/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Thor A740 Turnip",
            "description": "Custom Mesa Turnip Vulkan driver for AYN Thor Snapdragon 8 Gen 2 / Adreno 740",
            "author": "Thor A740 Project",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "${MESA_VERSION}",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          echo
          echo "meta.json:"
          cat package/meta.json

          echo
          echo "Checking driverVersion format..."

          python3 - <<'PY'
          import json
          import re

          with open("package/meta.json", "r", encoding="utf-8") as f:
              meta = json.load(f)

          required = [
              "schemaVersion",
              "name",
              "author",
              "packageVersion",
              "vendor",
              "driverVersion",
              "minApi",
              "libraryName",
          ]

          for key in required:
              if key not in meta:
                  raise SystemExit(f"Missing required metadata field: {key}")

          if meta["vendor"] != "Mesa":
              raise SystemExit("vendor must be Mesa")

          version = meta["driverVersion"]

          if not re.match(
              r"^[0-9]+\.[0-9]+\.[0-9]+(?:-.+)?$",
              version
          ):
              raise SystemExit(
                  f"Invalid driverVersion format: {version}"
              )

          if meta["libraryName"] != "libvulkan_freedreno.so":
              raise SystemExit(
                  "libraryName does not match driver filename"
              )

          print("meta.json validation PASSED")
          PY

          cd package

          zip -9 \
            "../out/ThorA740-Turnip-${MESA_VERSION}-${MESA_SHA}.zip" \
            libvulkan_freedreno.so \
            meta.json

          cd ..

      - name: Validate Eden driver ZIP
        run: |
          DRIVER_ZIP="$(find out \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            -print \
            -quit)"

          if [ -z "$DRIVER_ZIP" ]; then
            echo "ERROR: Driver ZIP not found."
            exit 1
          fi

          echo "Testing:"
          echo "$DRIVER_ZIP"

          echo
          echo "ZIP contents:"
          unzip -l "$DRIVER_ZIP"

          python3 - "$DRIVER_ZIP" <<'PY'
          import json
          import sys
          import zipfile

          driver_zip = sys.argv[1]

          with zipfile.ZipFile(driver_zip, "r") as z:
              files = {
                  name
                  for name in z.namelist()
                  if not name.endswith("/")
              }

              print("Files inside ZIP:")
              for item in sorted(files):
                  print(" -", item)

              required = {
                  "meta.json",
                  "libvulkan_freedreno.so",
              }

              missing = required - files

              if missing:
                  raise SystemExit(
                      "Missing required ZIP files: "
                      + ", ".join(sorted(missing))
                  )

              if "package/meta.json" in files:
                  raise SystemExit(
                      "meta.json is incorrectly inside a folder"
                  )

              meta = json.loads(
                  z.read("meta.json").decode("utf-8")
              )

              if meta.get("libraryName") not in files:
                  raise SystemExit(
                      "libraryName does not exist inside ZIP"
                  )

              print()
              print("Eden/AdrenoTools package validation PASSED")
          PY

          echo
          echo "Finished driver:"
          ls -lh "$DRIVER_ZIP"

      - name: Upload Thor A740 driver
        uses: actions/upload-artifact@v6
        with:
          name: ThorA740-Turnip-Eden
          path: out/*.zip
          if-no-files-found: error
