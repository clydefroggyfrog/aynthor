name: Build Thor A740 v8.1 Risky Behavior

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Whitebelyash Mesa branch, tag, or commit"
        required: true
        default: "turnip/gen8"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip ninja-build pkg-config \
            flex bison clang lld llvm ccache \
            python3 python3-pip patchelf glslang-tools patch file
          python3 -m pip install --break-system-packages -U \
            meson mako pyyaml packaging

      - name: Download Android NDK r29
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o /tmp/android-ndk.zip

          unzip -q /tmp/android-ndk.zip -d "$HOME"

          NDK_ROOT="$HOME/android-ndk-r29"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"

          test -x "$NDK_BIN/aarch64-linux-android33-clang"
          test -x "$NDK_BIN/aarch64-linux-android33-clang++"

      - name: Download Whitebelyash Turnip source
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
        run: |
          set -euxo pipefail
          rm -rf mesa

          git clone \
            --filter=blob:none \
            --no-single-branch \
            https://github.com/whitebelyash/mesa-unified.git \
            mesa

          git -C mesa fetch --depth=1 origin "$MESA_REF"
          git -C mesa checkout --detach FETCH_HEAD

          echo "Mesa commit:"
          git -C mesa rev-parse HEAD
          echo "Mesa version:"
          cat mesa/VERSION

      - name: Apply Android compatibility fixes
        working-directory: mesa
        run: |
          set -euxo pipefail

          sed -i \
            's/typedef const native_handle_t\* buffer_handle_t;/typedef void* buffer_handle_t;/g' \
            include/android_stub/cutils/native_handle.h || true

          sed -i \
            's/, hnd->handle/, (void *)hnd->handle/g' \
            src/util/u_gralloc/u_gralloc_fallback.c || true

          sed -i -E \
            's/([a-z_]+)->handle->/((const native_handle_t *)\1->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            's/anb->handle->/((const native_handle_t *)anb->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            "/-Werror=gnu-empty-initializer/d" \
            meson.build || true

      - name: Apply risky A740 behavior tuning
        working-directory: mesa
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("src/freedreno/vulkan/tu_autotune.cc")
          if not p.exists():
              raise SystemExit("ERROR: tu_autotune.cc not found")

          s = p.read_text()

          # Behavioral experiment:
          # prefer on-chip GMEM rather than the normal bandwidth estimator.
          pattern = r"DEFAULT\s*=\s*(?:BANDWIDTH|PROFILED|PROFILED_IMM|PREFER_GMEM|PREFER_SYSMEM)"
          m = re.search(pattern, s)
          if not m:
              raise SystemExit("ERROR: Turnip autotune DEFAULT selector not found")

          print("Original selector:", m.group(0))
          s, count = re.subn(pattern, "DEFAULT = PREFER_GMEM", s, count=1)
          if count != 1:
              raise SystemExit("ERROR: failed to select PREFER_GMEM")

          # Reduce profiled fallback warm-up if this source exposes the constant.
          if "MIN_PROFILE_DURATION_COUNT = 5" in s:
              s = s.replace(
                  "MIN_PROFILE_DURATION_COUNT = 5",
                  "MIN_PROFILE_DURATION_COUNT = 2",
                  1
              )

          p.write_text(s)

          verify = p.read_text()
          if "DEFAULT = PREFER_GMEM" not in verify:
              raise SystemExit("ERROR: PREFER_GMEM verification failed")

          print("Thor v8.1 behavior patch applied successfully")
          PY

          grep -n -E \
            'DEFAULT = (BANDWIDTH|PROFILED|PROFILED_IMM|PREFER_GMEM|PREFER_SYSMEM)|MIN_PROFILE_DURATION_COUNT' \
            src/freedreno/vulkan/tu_autotune.cc | head -20 || true

      - name: Create Android cross and native files
        working-directory: mesa
        run: |
          set -euxo pipefail

          # IMPORTANT:
          # Use the conservative compiler/linker configuration that already
          # produced the working v7.1 driver. The experiment is in Turnip
          # behavior, not ThinLTO or fragile linker optimizations.

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$NDK_BIN/llvm-ar'
          c = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang']
          cpp = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$NDK_BIN/ld.lld'
          cpp_ld = '$NDK_BIN/ld.lld'
          strip = '$NDK_BIN/llvm-strip'
          ranlib = '$NDK_BIN/llvm-ranlib'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat > native.txt <<EOF
          [binaries]
          c = ['ccache', 'clang']
          cpp = ['ccache', 'clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure Turnip v8.1
        working-directory: mesa
        env:
          CC: clang
          CXX: clang++
          AR: llvm-ar
          RANLIB: llvm-ranlib
          STRIP: llvm-strip
          OBJDUMP: llvm-objdump
          OBJCOPY: llvm-objcopy
          LDFLAGS: -fuse-ld=lld
        run: |
          set -euxo pipefail

          rm -rf build-android-aarch64
          rm -rf /tmp/turnip-thor-v81

          meson setup build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --native-file native.txt \
            --prefix /tmp/turnip-thor-v81 \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_lto=false \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=

      - name: Compile Turnip
        working-directory: mesa
        run: |
          set -o pipefail
          ninja -v -C build-android-aarch64 install 2>&1 \
            | tee /tmp/thor-v81-build.log

      - name: Inspect compiled driver
        run: |
          set -euxo pipefail

          DRIVER="$(find /tmp/turnip-thor-v81 mesa/build-android-aarch64 \
            -type f -name 'libvulkan_freedreno.so' -print -quit)"

          if [ -z "$DRIVER" ] || [ ! -f "$DRIVER" ]; then
            echo "ERROR: libvulkan_freedreno.so was not produced."
            echo "Last 200 build-log lines:"
            tail -200 /tmp/thor-v81-build.log || true
            exit 1
          fi

          echo "Driver:"
          file "$DRIVER"

          echo "Dependencies:"
          patchelf --print-needed "$DRIVER" || true

      - name: Package Eden driver
        run: |
          set -euxo pipefail

          DRIVER="$(find /tmp/turnip-thor-v81 mesa/build-android-aarch64 \
            -type f -name 'libvulkan_freedreno.so' -print -quit)"

          MESA_VERSION="$(tr -d '\r\n' < mesa/VERSION)"
          MESA_SHA="$(git -C mesa rev-parse --short=12 HEAD)"

          rm -rf package out
          mkdir -p package out

          cp "$DRIVER" package/libvulkan_freedreno.so
          "$NDK_BIN/llvm-strip" \
            --strip-unneeded \
            package/libvulkan_freedreno.so || true

          cat > package/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Thor A740 v8.1 Risky GMEM",
            "description": "Experimental AYN Thor Adreno 740 Turnip build for Eden. Prefer-GMEM behavior with conservative known-good compiler settings.",
            "author": "Thor A740 Project",
            "packageVersion": "8.1-risky-gmem",
            "vendor": "Mesa",
            "driverVersion": "${MESA_VERSION}-${MESA_SHA}",
            "minApi": 33,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          ZIP="out/ThorA740-v8.1-Risky-GMEM-${MESA_VERSION}-${MESA_SHA}.zip"

          (
            cd package
            zip -9 "../$ZIP" \
              libvulkan_freedreno.so \
              meta.json
          )

          echo "Created:"
          ls -lh "$ZIP"
          unzip -l "$ZIP"

      - name: Validate Eden package
        run: |
          set -euxo pipefail

          ZIP="$(find out -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          test -f "$ZIP"

          python3 - "$ZIP" <<'PY'
          import json
          import sys
          import zipfile

          path = sys.argv[1]

          with zipfile.ZipFile(path) as z:
              files = {x for x in z.namelist() if not x.endswith("/")}
              expected = {"meta.json", "libvulkan_freedreno.so"}

              if files != expected:
                  raise SystemExit(f"Wrong ZIP contents: {sorted(files)}")

              meta = json.loads(z.read("meta.json"))
              assert meta["libraryName"] == "libvulkan_freedreno.so"
              assert meta["minApi"] == 33
              assert meta["packageVersion"] == "8.1-risky-gmem"

          print("Thor A740 v8.1 package validation PASSED")
          PY

      - name: Upload Thor A740 v8.1 driver
        uses: actions/upload-artifact@v6
        with:
          name: ThorA740-v8.1-Risky-GMEM
          path: out/*.zip
          if-no-files-found: error
