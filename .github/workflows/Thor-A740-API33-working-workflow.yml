name: Build Thor A740 API33

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa branch, tag, or commit"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip ninja-build pkg-config \
            flex bison clang lld llvm ccache \
            python3 python3-pip patchelf glslang-tools patch file
          python3 -m pip install --break-system-packages -U \
            meson mako pyyaml packaging

      - name: Download Android NDK r29
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip \
            -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d "$HOME"

          NDK_ROOT="$HOME/android-ndk-r29"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"

          test -x "$NDK_BIN/aarch64-linux-android33-clang"
          test -x "$NDK_BIN/aarch64-linux-android33-clang++"

      - name: Download Mesa
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
        run: |
          set -euxo pipefail
          rm -rf mesa

          git clone --filter=blob:none \
            https://github.com/mirror/mesa.git mesa

          git -C mesa fetch --depth=1 origin "$MESA_REF"
          git -C mesa checkout --detach FETCH_HEAD

          echo "Mesa commit:"
          git -C mesa rev-parse HEAD
          echo "Mesa version:"
          cat mesa/VERSION

      - name: Apply Android NDK compatibility fixes
        working-directory: mesa
        run: |
          set -euxo pipefail

          sed -i \
            's/typedef const native_handle_t\* buffer_handle_t;/typedef void* buffer_handle_t;/g' \
            include/android_stub/cutils/native_handle.h || true

          sed -i \
            's/, hnd->handle/, (void *)hnd->handle/g' \
            src/util/u_gralloc/u_gralloc_fallback.c || true

          sed -i -E \
            's/([a-z_]+)->handle->/((const native_handle_t *)\1->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            's/anb->handle->/((const native_handle_t *)anb->handle)->/g' \
            src/vulkan/runtime/vk_android.c || true

          sed -i \
            "/-Werror=gnu-empty-initializer/d" meson.build || true

      - name: Create Android API 33 cross file
        working-directory: mesa
        run: |
          set -euxo pipefail

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$NDK_BIN/llvm-ar'
          c = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang']
          cpp = ['ccache', '$NDK_BIN/aarch64-linux-android33-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '$NDK_BIN/ld.lld'
          cpp_ld = '$NDK_BIN/ld.lld'
          strip = '$NDK_BIN/llvm-strip'
          ranlib = '$NDK_BIN/llvm-ranlib'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat android-aarch64.txt

      - name: Configure Turnip
        working-directory: mesa
        run: |
          set -euxo pipefail
          rm -rf build-android-aarch64 /tmp/turnip-api33

          meson setup build-android-aarch64 \
            --cross-file android-aarch64.txt \
            --prefix /tmp/turnip-api33 \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=

      - name: Compile Turnip
        working-directory: mesa
        run: |
          set -euxo pipefail
          ninja -C build-android-aarch64 install

      - name: Inspect compiled driver
        run: |
          set -euxo pipefail

          DRIVER="/tmp/turnip-api33/lib/libvulkan_freedreno.so"

          if [ ! -f "$DRIVER" ]; then
            echo "ERROR: libvulkan_freedreno.so was not produced."
            find /tmp/turnip-api33 -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "Driver file:"
          file "$DRIVER"

          echo "ELF Android notes:"
          readelf -n "$DRIVER" || true

          echo "Dependencies:"
          patchelf --print-needed "$DRIVER" || true

      - name: Package Eden driver
        run: |
          set -euxo pipefail

          DRIVER="/tmp/turnip-api33/lib/libvulkan_freedreno.so"
          MESA_VERSION="$(tr -d '\r\n' < mesa/VERSION)"
          MESA_SHA="$(git -C mesa rev-parse --short=12 HEAD)"

          rm -rf package out
          mkdir -p package out

          cp "$DRIVER" package/libvulkan_freedreno.so

          cat > package/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "Thor A740 Turnip API33",
            "description": "Mesa Turnip driver for AYN Thor Snapdragon 8 Gen 2 / Adreno 740, Android 13 API 33",
            "author": "Thor A740 Project",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.4.335",
            "minApi": 33,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          ZIP="out/ThorA740-Turnip-API33-${MESA_VERSION}-${MESA_SHA}.zip"

          (
            cd package
            zip -9 "../$ZIP" libvulkan_freedreno.so meta.json
          )

          echo "Created driver package:"
          ls -lh "$ZIP"

          echo "Package contents:"
          unzip -l "$ZIP"

      - name: Validate package
        run: |
          set -euxo pipefail

          ZIP="$(find out -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          test -f "$ZIP"

          python3 - "$ZIP" <<'PY'
          import json
          import sys
          import zipfile

          path = sys.argv[1]

          with zipfile.ZipFile(path) as z:
              files = {x for x in z.namelist() if not x.endswith("/")}
              required = {"meta.json", "libvulkan_freedreno.so"}

              if files != required:
                  raise SystemExit(
                      f"Wrong ZIP contents: {sorted(files)}"
                  )

              meta = json.loads(z.read("meta.json"))

              if meta.get("libraryName") != "libvulkan_freedreno.so":
                  raise SystemExit("libraryName is wrong")

              if meta.get("minApi") != 33:
                  raise SystemExit("minApi is wrong")

              if not meta.get("name"):
                  raise SystemExit("driver name is missing")

          print("Eden package validation PASSED")
          PY

      - name: Upload driver
        uses: actions/upload-artifact@v6
        with:
          name: ThorA740-Turnip-API33
          path: out/*.zip
          if-no-files-found: error
