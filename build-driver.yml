name: Build Eden Thor A740 driver

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa branch, tag, or commit"
        required: true
        default: "main"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout driver kit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip zip ninja-build pkg-config flex bison python3 python3-pip patchelf clang lld ccache
          python3 -m pip install --break-system-packages -U meson mako pyyaml packaging

      - name: Build balanced + performance packages
        env:
          MESA_REF: ${{ inputs.mesa_ref }}
        run: ./scripts/build.sh both

      - name: Upload driver packages
        uses: actions/upload-artifact@v4
        with:
          name: ThorA740-drivers
          path: |
            out/*.zip
            out/*.sha256
          if-no-files-found: error
